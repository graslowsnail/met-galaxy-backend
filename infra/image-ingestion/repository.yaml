AWSTemplateFormatVersion: "2010-09-09"
Description: Container repository for the image ingestion Lambda

Resources:
  ImageIngestionRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: met-galaxy-image-ingestion
      EmptyOnDelete: false
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the newest 10 worker images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt ImageIngestionRepository.RepositoryUri
