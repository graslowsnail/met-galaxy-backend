AWSTemplateFormatVersion: "2010-09-09"
Description: Container repository for the canonical OpenCLIP worker

Resources:
  ImageEmbeddingRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: met-galaxy-image-embedding
      EmptyOnDelete: false
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the newest 5 embedding images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt ImageEmbeddingRepository.RepositoryUri
